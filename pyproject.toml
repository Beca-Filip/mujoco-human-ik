[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mujoco-human-ik-package"
version = "0.1.3"
description = 'Retargets human motion capture data onto a MuJoCo humanoid model via inverse kinematics.'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Bečanović, Filip", email = "filip.becanovic@etf.bg.ac.rs" },
  { name = "Svilar, Marina", email = "svilarmarina@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=2.2",
  "scipy>=1.15",
  "pandas>=2.3",
  "matplotlib>=3.10",
  "mujoco>=3.3",
  "imageio>=2.37",
]

[project.urls]
Documentation = "https://github.com/Beca-Filip/mujoco-human-ik/blob/main/README.md"
Issues = "https://github.com/Beca-Filip/mujoco-human-ik/issues"
Source = "https://github.com/Beca-Filip/mujoco-human-ik.git"


